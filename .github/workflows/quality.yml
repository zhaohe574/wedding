name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  server-php-lint:
    name: Server PHP syntax
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 13367:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WEDDING_TEST_MYSQL_PORT: '13367'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, json, fileinfo, pdo_mysql, bcmath, curl, gd, imagick, dom, zip, redis
          coverage: none
      - name: Install backend dependencies
        run: composer install --working-dir=server --prefer-dist --no-interaction
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find server/app server/config server/database server/route server/public/install -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Payment schedule regression
        run: php server/tests/regression/PaymentScheduleReliabilityTest.php
      - name: Material scope regression
        run: php server/tests/regression/MaterialScopeTest.php
      - name: Project audit regression
        run: php server/tests/regression/ProjectAuditRegressionTest.php
      - name: Release upgrade regression
        run: php server/tests/regression/ReleaseUpgradeTest.php
      - name: Fresh install and business regression
        run: php server/tests/regression/FreshInstallPaymentTest.php
      - name: Installer regression
        run: php server/tests/regression/InstallerTest.php
      - name: Poster rendering regression
        run: php server/tests/regression/PosterRenderingTest.php
      - name: Concurrent payment and notification regression
        run: php server/tests/regression/ConcurrentPaymentNotificationTest.php
      - name: v2 aggregate contract regression
        run: php server/tests/regression/V2AggregateTest.php

  admin-quality:
    name: Admin type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run build:check
      - run: npm run type-check:active
      - name: ESLint
        run: npm run lint

  # 旧包（legacy）：2026-11-11 起冻结，仅为线上存量保留校验。
  # 新功能/修复一律在 newuniapp；不要因为本任务失败去改 uniapp 业务代码。
  uniapp-quality:
    name: Legacy uniapp validation (frozen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: uniapp/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run validate:config
      - run: npm run type-check:active
      - run: npm run build:mp-weixin:check

  pc-quality:
    name: PC quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run quality
      - run: npm run build:check

  root-contract-checks:
    name: Root contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run contract checks
        run: npm run qa:contracts

  contracts-drift:
    name: Contracts drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 状态契约未漂移（PHP 常量 == 生成物）
        run: npm run contracts:check
      - name: 端点契约未漂移 + 命名合规
        run: node scripts/contracts/export-endpoints.mjs --check
      - name: 无手写状态文案 / 无 toFixed(2) 金额
        run: node scripts/check-contract-usage.mjs

  newuniapp-quality:
    name: New uniapp quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newuniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: newuniapp/package-lock.json
      - run: npm ci
      - name: Type check（全量，无白名单）
        run: npm run type-check
      - name: 页面路由引用校验
        run: npm run pages:check
      - name: Build mp-weixin
        run: npm run build:mp-weixin
      - name: 主包体积 + 产物 app.json 引用完整性
        run: npm run validate:build
