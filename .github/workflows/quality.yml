name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  server-php-lint:
    name: Server PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, json, fileinfo
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find server/app server/config server/route -name '*.php' -print0 | xargs -0 -n1 php -l

  admin-quality:
    name: Admin type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run type-check:active

  uniapp-quality:
    name: Uniapp validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: uniapp/package-lock.json
      - run: npm ci
      - run: npm run validate:all

  pc-quality:
    name: PC quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: npm ci
      - run: npm run quality

  core-contract-checks:
    name: Core reliability contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run static P0/P1/P2 contract checks
        run: node tests/qa/p0_p1_p2_contract_checks.js
