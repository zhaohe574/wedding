# 放入该站点的 extension 目录，由宝塔现有配置加载。
# 本机回环请求用于维护期间只读验收，外部请求返回 503。
set $gelinshe_maintenance 0;
if (-f /www/maintenance/gelinshe.flag) {
    set $gelinshe_maintenance 1;
}
if ($remote_addr = 127.0.0.1) {
    set $gelinshe_maintenance 0;
}
if ($gelinshe_maintenance = 1) {
    return 503;
}

location = /crontab {
    return 404;
}

location /pc/ {
    try_files $uri $uri/ /pc/index.html;
}

location /gelinshe0318/ {
    try_files $uri $uri/ /gelinshe0318/index.html;
}
